# NVIDIA — RTX 3060 Mobile (GA106M), hybrid với Intel UHD
# /etc/modprobe.d/99-nvidia.conf

# Bắt buộc cho Wayland
options nvidia_drm modeset=1 fbdev=1

# Giữ VRAM khi suspend (máy không hỗ trợ S0ix -> dùng S3)
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp

# Cho phép Runtime D3 (tắt dGPU khi rảnh) — mặc định đã bật, khai báo cho chắc
options nvidia NVreg_DynamicPowerManagement=0x02
