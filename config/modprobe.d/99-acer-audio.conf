# Realtek ALC295 — Acer Nitro AN515-57 (subsystem 0x10251539)
# CHỈ bật nếu jack tai nghe / mic không hoạt động.
# Bật bằng:  ENABLE_ACER_AUDIO_QUIRK=1 ./post-install.sh
# /etc/modprobe.d/99-acer-audio.conf

options snd-hda-intel model=alc295-headset

# Nếu vẫn lỗi, thử lần lượt:
# options snd-hda-intel model=alc295-mic
# options snd-hda-intel model=acer-aspire
# options snd-hda-intel model=auto
