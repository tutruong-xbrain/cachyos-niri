# Tinh chỉnh cho laptop 24GB RAM + zram + SSD NVMe
# /etc/sysctl.d/99-laptop.conf

# zram làm swap -> swappiness cao là bình thường
vm.swappiness = 100

# Ít quét inode cache hơn (SSD + RAM nhiều)
vm.vfs_cache_pressure = 50

# Giảm ghi đĩa
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# Tiết kiệm pin nhẹ
kernel.nmi_watchdog = 0
